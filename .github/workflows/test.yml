name: "Ellen Tests"

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: "Run Ellen's test suite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint check
        run: npx eslint . --ext .js,.json --no-error-on-unmatched-pattern || true

      - name: Run tests
        id: tests
        run: npm test
        continue-on-error: true

      - name: Comment on PR (tests passed)
        if: github.event_name == 'pull_request' && steps.tests.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🦈 all good.'
            })

      - name: Comment on PR (tests failed)
        if: github.event_name == 'pull_request' && steps.tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🦈 tests failed. Ellen is not happy.'
            })

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
